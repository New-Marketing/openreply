name: New Marketing - montar imagem

# Monta a imagem Docker fora da VPS (para não gastar memória/disco lá) e
# publica no GitHub Container Registry. A VPS só baixa a imagem pronta.

on:
  push:
    branches: [main]
    paths-ignore: ['new-marketing/**', '**.md']
  workflow_dispatch:

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/new-marketing/openreply:latest
            ghcr.io/new-marketing/openreply:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
